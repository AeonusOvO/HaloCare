<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云脉珍心</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --motion-fast: 120ms;
        --motion-base: 180ms;
        --motion-slow: 260ms;
        --motion-page: 420ms;
        --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-enter: cubic-bezier(0, 0, 0.2, 1);
        --ease-elegant: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html {
        background-color: #f7f5f0;
      }

      body {
        font-family: 'Noto Serif SC', serif;
        background-color: #f7f5f0; /* Rice paper color */
        margin: 0;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root {
        min-height: 100dvh;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes breathe-opacity {
        0%, 100% { opacity: 0.1; transform: translate3d(40px, 40px, 0) scale(1); }
        50% { opacity: 0.14; transform: translate3d(36px, 36px, 0) scale(1.015); }
      }
      @keyframes pulse-line {
        0%, 100% { transform: scaleY(0.42); opacity: 0.45; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      .motion-enter {
        animation: fade-up var(--motion-slow) var(--ease-elegant) both;
      }
      .motion-scale-in {
        animation: scale-in var(--motion-slow) var(--ease-elegant) both;
      }
      .motion-enter-delay-1 { animation-delay: 60ms; }
      .motion-enter-delay-2 { animation-delay: 110ms; }
      .motion-enter-delay-3 { animation-delay: 150ms; }
      .motion-card {
        transition: transform var(--motion-base) var(--ease-standard), box-shadow var(--motion-base) var(--ease-standard), border-color var(--motion-base) var(--ease-standard), background-color var(--motion-base) var(--ease-standard);
      }
      .motion-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
      }
      .motion-press {
        transition: transform var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
      }
      .motion-press:active {
        transform: translateY(1px) scale(0.98);
      }
      .motion-breathe {
        animation: breathe-opacity 7s var(--ease-elegant) infinite;
      }
      .pulse-line {
        animation: pulse-line 1.4s var(--ease-standard) infinite;
        transform-origin: center;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
        .motion-enter,
        .motion-scale-in {
          animation-name: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {

  }
}
</script>
</head>

</body>
</html>
